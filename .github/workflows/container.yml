name: Build and Push Container Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install syft
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action/download-syft@v0.24.3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with 'latest' on main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with version on git tags (e.g., v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            # Tag with major.minor on git tags (e.g., v1.0.0 -> 1.0)
            type=semver,pattern={{major}}.{{minor}}
            # Tag with major on git tags (e.g., v1.0.0 -> 1)
            type=semver,pattern={{major}}
            # Tag with git SHA for traceability
            type=sha
          labels: |
            org.opencontainers.image.title=Chantal
            org.opencontainers.image.description=Unified offline repository mirroring for RPM and APT
            org.opencontainers.image.vendor=Simon Lauger

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          sbom: true
          provenance: true

      # Keyless signature on the multi-arch index. All tags pushed by this run
      # point at the same digest, so one signature covers them.
      - name: Sign image with cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # BuildKit attaches an unsigned SPDX SBOM to every platform image, which
      # CycloneDX-only consumers such as Dependency-Track cannot read. syft
      # generates both formats from the pushed per-platform images.
      - name: Generate SBOMs
        if: github.event_name != 'pull_request'
        env:
          # Packages only: without this, every file owned by an RPM becomes a CycloneDX component
          SYFT_FILE_METADATA_SELECTION: none
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
          PLATFORMS: linux/amd64,linux/arm64
        run: |
          NAME="${IMAGE##*/}"
          INDEX=$(docker buildx imagetools inspect "${IMAGE}@${INDEX_DIGEST}" --format '{{json .Manifest}}')

          mkdir -p sbom
          for PLATFORM in ${PLATFORMS//,/ }; do
            DIGEST=$(jq -r --arg os "${PLATFORM%%/*}" --arg arch "${PLATFORM#*/}" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' <<< "${INDEX}")
            if [[ -z "${DIGEST}" ]]; then
              echo "::error::no ${PLATFORM} image in ${IMAGE}@${INDEX_DIGEST}"
              exit 1
            fi
            BASE="sbom/${NAME}-${VERSION}-${PLATFORM//\//-}"
            syft scan "registry:${IMAGE}@${DIGEST}" \
              --source-name "${IMAGE}" --source-version "${VERSION}" \
              -o "cyclonedx-json=${BASE}.cdx.json" \
              -o "spdx-json=${BASE}.spdx.json"
            echo "${DIGEST}" > "${BASE}.digest"
          done

      # An SBOM describes one platform image, so it is attested against the
      # platform digest rather than the index.
      - name: Attest CycloneDX SBOMs with cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          for CDX in sbom/*.cdx.json; do
            DIGEST=$(cat "${CDX%.cdx.json}.digest")
            cosign attest --yes --type cyclonedx --predicate "${CDX}" "${IMAGE}@${DIGEST}"
          done

      - name: Upload SBOMs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sbom-chantal
          path: sbom/*.json
          retention-days: 7

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
